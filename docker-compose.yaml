services:
  db:
    image: postgres:16-alpine
    container_name: expense-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - expense-network
    # Проверка, что база готова принимать подключения
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: expense-tracker:latest
    container_name: expense-app
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - expense-network

volumes:
  postgres_data:

networks:
  expense-network:
    driver: bridge